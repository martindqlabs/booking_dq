name: 'booking_payments_dq_snowflake'
version: '1.0.0'
config-version: 2

profile: 'booking_payments_dq_snowflake'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

# Same rule thresholds as dbt_demo (see ../dbt_demo/dbt_project.yml) so the
# two projects stay behaviorally identical -- only the source/target backend
# differs.
vars:
  deprecated_currencies: ['BGN']
  bgn_deprecation_cutoff: '2026-01-01'
  settlement_sla_days: 10
  dc_sla_days: 5
  braintree_fast_track_days: 1
  volume_anomaly_pct_threshold: 0.30

models:
  booking_payments_dq_snowflake:
    bronze:
      +materialized: view
      # NOT +schema: bronze -- that's the physical landing schema
      # (BOOKING_DQ.BRONZE) these models select from. Materializing here
      # would collide with the source tables of the same name and cause
      # dbt to drop them on a table->view relation swap. See README.
      +schema: bronze_typed
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
    customer_pipeline:
      # Separate pipeline/domain (customer/orders/transactions), own database --
      # loaded via its own Airflow DAG, not part of this project's bronze/silver/
      # gold lineage. +database override keeps it out of BOOKING_DQ regardless
      # of this profile's default target database.
      +database: CUSTOMER_PIPELINE
      staging:
        +materialized: view
        +schema: silver
      gold:
        +materialized: table
        +schema: gold
